name: release

# Pushing a tag such as v0.3.0 tests the code, builds the download (rumil-v0.3.0.zip) and a wheel, and publishes
# a GitHub release with both attached. `rumil update` installs from the newest release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test
        run: |
          python -m pip install -e ".[test]"
          python -m pytest -q
      - name: Check that the tag matches the version in the code
        run: |
          v=$(python -c "import rumil; print(rumil.__version__)")
          p=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$v" != "$GITHUB_REF_NAME" ] || [ "$v" != "$p" ]; then
            echo "Tag $GITHUB_REF_NAME, rumil/__init__.py $v and pyproject.toml $p must agree"; exit 1
          fi
      - name: Build the release zip and wheel
        run: |
          mkdir -p dist out
          git archive --format=tar --prefix=rumil/ HEAD | tar -x -C out
          (cd out/rumil/skill && zip -qr rumil-citations.zip rumil-citations)
          (cd out && zip -qr "../dist/rumil-${GITHUB_REF_NAME}.zip" rumil)
          python -m pip install build
          python -m build --wheel --outdir dist
      - name: Release notes from CHANGELOG.md
        run: python .github/release_notes.py "${GITHUB_REF_NAME#v}" > notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Rumil $GITHUB_REF_NAME" --notes-file notes.md
